<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <title>Dashboard - Thijodrot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Epunda+Slab:wght@400;700&family=Kanit:wght@300;600&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="icon" type="image/png" href="park.png" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>

<body>
  <nav id="navbar">
    <div class="logo">
      <a href="/">Thijodrot</a>
    </div>
    <button id="logoutBtn">Logout</button>
  </nav>

  <main class="dashboard">

    <!-- LEFT PANEL -->
    <section class="left-panel">
      <h2>ปรับสถานะช่องจอด</h2>

      <div class="slot-status-container">
        <p class="status-text">
          <span class="slot-label">A1</span>
          <span id="statusValue1" class="status-vacant">ว่าง</span>
        </p>
        <button id="toggleStatusBtn1" class="toggle-status-btn">เปลี่ยนสถานะ</button>
      </div>

      <div class="slot-status-container">
        <p class="status-text">
          <span class="slot-label">A2</span>
          <span id="statusValue2" class="status-occupied">ไม่ว่าง</span>
        </p>
        <button id="toggleStatusBtn2" class="toggle-status-btn">เปลี่ยนสถานะ</button>
      </div>

      <h2>การใช้พลังงาน</h2>

      <div class="slot-status-container">
        <p class="status-text">
          <span class="slot-label">พลังงานที่ใช้ล่าสุด</span>
          <span id="latestUse" class="status-energy">-</span>
        </p>
      </div>

      <div class="slot-status-container">
        <p class="status-text">
          <span class="slot-label">ค่าเฉลี่ยพลังงานที่ใช้</span>
          <span id="averageUse" class="status-energy">-</span>
        </p>
      </div>
    </section>

    <!-- RIGHT PANEL -->
    <section class="right-panel">
      <h2>สถิติการจอดรถ</h2>

      <div class="chart-container">
        <canvas id="parkingDurationChart"></canvas>
        <canvas id="parkingEntryChart"></canvas>
      </div>

      <div class="filter-container">
        <label for="monthSelect">เดือน:</label>
        <select id="monthSelect">
          <option value="">-- ทั้งปี --</option>
          <option value="1">มกราคม</option>
          <option value="2">กุมภาพันธ์</option>
          <option value="3">มีนาคม</option>
          <option value="4">เมษายน</option>
          <option value="5">พฤษภาคม</option>
          <option value="6">มิถุนายน</option>
          <option value="7">กรกฎาคม</option>
          <option value="8">สิงหาคม</option>
          <option value="9">กันยายน</option>
          <option value="10">ตุลาคม</option>
          <option value="11">พฤศจิกายน</option>
          <option value="12">ธันวาคม</option>
        </select>

        <label for="yearSelect">ปี:</label>
        <select id="yearSelect"></select>

        <button id="loadChartBtn">โหลดข้อมูล</button>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="dashboard.js"></script>
</body>

</html>
