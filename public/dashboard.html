<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <title>Dashboard - Thijodrot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Epunda+Slab:ital,wght@0,300..900;1,300..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <nav id="navbar">
    <div class="logo">
      <a href="/">Thijodrot</a>
    </div>
    <button id="logoutBtn">Logout</button>
  </nav>
  </nav>

  <main>
    <div class="slot-status-container">
      <p id="carStatusText1" class="status-text">
        <span class="slot-label">A1</span>
        <span id="statusValue1"></span>
      </p>
      <button id="toggleStatusBtn1" class="toggle-status-btn">กำลังโหลด...</button>
    </div>

    <div class="slot-status-container">
      <p id="carStatusText2" class="status-text">
        <span class="slot-label">A2</span>
        <span id="statusValue2"></span>
      </p>
      <button id="toggleStatusBtn2" class="toggle-status-btn">กำลังโหลด...</button>
    </div>
  </main>

  <script src="dashboard.js"></script>
</body>

</html>
